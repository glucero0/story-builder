[project]
name = "story-builder"
version = "1.0.0"
description = "Desktop app that orders dropped text fragments into a story with OpenRouter."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "glucero0" }]
keywords = ["story", "openrouter", "markdown", "desktop"]
dependencies = ["PySide6>=6.7.0", "PyYAML>=6.0"]

[project.urls]
Issues = "https://github.com/glucero0/story-builder/issues"

[project.scripts]
story-builder = "story_builder.window:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["story_builder*"]
